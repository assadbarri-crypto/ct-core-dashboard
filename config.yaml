# Root of all CT data (parent of SW-1, SW-2, ...)
root: "."

# Which sample folder is currently active (matches "Sample Index" in General_data.txt)
active_sample: ""

# Where the sample-info text file lives
general_data_file: "./General_data.txt"

# The two condition folders the dashboard compares.
# These can be any sub-folders of the active sample (e.g. dry, saturated, brine, co2, ...).
set1: "SW1_dry"
set2: "SW1_saturated"

# Default viewer settings (overridable in the UI)
defaults:
  region_diameter_px: 450
  center_px: [273, 255]
  center_sat_px: [257, 260]
  line_length_ratio: 0.9
  num_lines_above: 2
  num_lines_below: 2
  num_lines_left: 2
  num_lines_right: 2
  num_diag_above: 2
  num_diag_below: 2
  num_selected_points: 21
  colormap: "jet"
  vmin: 1440
  vmax: 1640
  auto_center_threshold: 1300

# Slice trimming — skip the ends of the core where air corrupts the ROI
# Applied to both sets equally (kept symmetric for fair comparison).
trims:
  skip_first: 5
  skip_last: 3